<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact DJ Biery | Web Development Portfolio</title>
    <meta name="author" content="DJ Biery">
    <meta name="description" content="Contact DJ Biery through this web development portfolio contact form.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet" type="text/css">
</head>

<body>

<div class="wrapper">

    <header>
        <img src="images/technology-foreground.jpg" alt="Technology themed header image">
        <h1>DJ Biery</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="resume.html">Resume</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="newsletter.html">Newsletter</a>
        <a href="contact.html"><span class="selected">Contact</span></a>
    </nav>

    <main>

        <h2>Contact Me</h2>

        <form name="contactForm" id="contactForm"
              action="https://biersubmit.x10.network/FormProcess.php"
              method="post">

            <table class="contact-table">

                <tr>
                    <th colspan="2">Contact DJ Biery</th>
                </tr>

                <tr>
                    <td class="field-label">
                        <span class="required">*</span>
                        <label for="FirstName">First Name</label>
                    </td>
                    <td>
                        <input type="text" name="FirstName" id="FirstName"
                               size="40" required>
                    </td>
                </tr>

                <tr>
                    <td class="field-label">
                        <span class="required">*</span>
                        <label for="LastName">Last Name</label>
                    </td>
                    <td>
                        <input type="text" name="LastName" id="LastName"
                               size="40" required>
                    </td>
                </tr>

                <tr>
                    <td class="field-label">
                        <label for="City">City</label>
                    </td>
                    <td>
                        <input type="text" name="City" id="City" size="40">
                    </td>
                </tr>

                <tr>
                    <td class="field-label">
                        <label for="State">ST</label>
                    </td>
                    <td>
                        <select name="State" id="State">
                            <option value="FL" selected>Florida</option>
                            <option value="AL">Alabama</option>
                            <option value="AK">Alaska</option>
                            <option value="AZ">Arizona</option>
                            <option value="AR">Arkansas</option>
                            <option value="CA">California</option>
                            <option value="CO">Colorado</option>
                            <option value="CT">Connecticut</option>
                            <option value="DE">Delaware</option>
                            <option value="GA">Georgia</option>
                            <option value="HI">Hawaii</option>
                            <option value="ID">Idaho</option>
                            <option value="IL">Illinois</option>
                            <option value="IN">Indiana</option>
                            <option value="IA">Iowa</option>
                            <option value="KS">Kansas</option>
                            <option value="KY">Kentucky</option>
                            <option value="LA">Louisiana</option>
                            <option value="ME">Maine</option>
                            <option value="MD">Maryland</option>
                            <option value="MA">Massachusetts</option>
                            <option value="MI">Michigan</option>
                            <option value="MN">Minnesota</option>
                            <option value="MS">Mississippi</option>
                            <option value="MO">Missouri</option>
                            <option value="MT">Montana</option>
                            <option value="NE">Nebraska</option>
                            <option value="NV">Nevada</option>
                            <option value="NH">New Hampshire</option>
                            <option value="NJ">New Jersey</option>
                            <option value="NM">New Mexico</option>
                            <option value="NY">New York</option>
                            <option value="NC">North Carolina</option>
                            <option value="ND">North Dakota</option>
                            <option value="OH">Ohio</option>
                            <option value="OK">Oklahoma</option>
                            <option value="OR">Oregon</option>
                            <option value="PA">Pennsylvania</option>
                            <option value="RI">Rhode Island</option>
                            <option value="SC">South Carolina</option>
                            <option value="SD">South Dakota</option>
                            <option value="TN">Tennessee</option>
                            <option value="TX">Texas</option>
                            <option value="UT">Utah</option>
                            <option value="VT">Vermont</option>
                            <option value="VA">Virginia</option>
                            <option value="WA">Washington</option>
                            <option value="WV">West Virginia</option>
                            <option value="WI">Wisconsin</option>
                            <option value="WY">Wyoming</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="field-label">
                        <label for="Zip">Zip</label>
                    </td>
                    <td>
                        <input type="text" name="Zip" id="Zip"
                               pattern="[0-9]{5}" title="Five digit zip code"
                               maxlength="5" size="10">
                    </td>
                </tr>

                <tr>
                    <td class="field-label">
                        <span class="required">*</span>
                        <label for="Email">Email</label>
                    </td>
                    <td>
                        <input type="email" name="Email" id="Email"
                               size="40" required>
                    </td>
                </tr>

                <tr>
                    <td class="field-label">Gender</td>
                    <td>
                        <input type="radio" name="Gender" id="M" value="M">
                        <label for="M">Male</label>

                        <input type="radio" name="Gender" id="F" value="F">
                        <label for="F">Female</label>
                    </td>
                </tr>

                <tr>
                    <td class="field-label">Education</td>
                    <td>
                        <input type="checkbox" name="Education" id="HS" value="HS">
                        <label for="HS">H.S.</label>

                        <input type="checkbox" name="Education" id="College" value="College">
                        <label for="College">College</label>
                    </td>
                </tr>

                <tr>
                    <td class="field-label">
                        <span class="required">*</span>
                        <label for="Comments">Comments</label>
                    </td>
                    <td>
                        <textarea name="Comments" id="Comments"
                                  rows="5" cols="42"
                                  placeholder="Enter your comments here..."
                                  required></textarea>
                    </td>
                </tr>

                <tr>
                    <td class="field-label"></td>
                    <td>
                        <input type="reset" name="Reset" value="Reset">
                        <input type="submit" value="Submit">
                    </td>
                </tr>

            </table>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 DJ Biery. All rights reserved.</p>
    </footer>

</div> <!-- close wrapper -->

</body>
</html>
